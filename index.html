<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#244c46"><title>红楼说书 · 寒家谋生</title><link rel="stylesheet" href="./src/style.css?v=20261117-returnhome"><script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/","./src/engine.js":"./src/engine.js?v=20261117-returnhome","./src/stage.js":"./src/stage.js?v=20261117-returnhome","./src/audio.js":"./src/audio.js?v=20261117-returnhome","./src/soundtrack.js":"./src/soundtrack.js?v=20261117-returnhome","./src/director.js":"./src/director.js?v=20261117-returnhome","./src/presentation.js":"./src/presentation.js?v=20261117-returnhome","./src/resource-loader.js":"./src/resource-loader.js?v=20261117-returnhome"}}</script></head>
<body>
<header class="masthead"><a class="brand" href="./"><span class="seal">红楼</span><span>说书舞台<small>一进荣国府</small></span></a><button id="open-inspector" class="quiet">演出指令</button></header>
<main>
 <h1 class="sr-only">寒家谋生</h1>
 <section class="player-layout">
  <div class="performance">
   <div class="stage-shell"><div id="stage" role="img" aria-label="狗儿家的三维舞台与纸片人物"></div><div class="stage-topline"><button id="camera-reset" class="scene-button">全景</button></div><div id="loading" class="loading"><div class="spinner"></div><strong>正在布置舞台</strong><span id="load-status">载入屋舍与人物</span></div><div id="dialogue" class="dialogue hidden" aria-live="polite"><p id="dialogue-text"><span id="dialogue-visible" aria-hidden="true"></span><span id="dialogue-pending" class="typed-pending" aria-hidden="true"></span></p></div><div id="scene-overlay" class="scene-overlay hidden" aria-live="polite"><div class="overlay-copy"><span id="opening-subtitle"></span><h2 id="opening-title"></h2><p id="bridge-text"></p><i aria-hidden="true"></i></div><button id="skip-overlay" class="scene-button">略过</button></div><div id="ending" class="ending hidden"><span>第一场 · 完</span><h2>祖孙出门，故事方始。</h2><p>这一回，先说到这里。</p><button id="ending-replay">再听一遍</button></div></div>

   <div class="transport"><div class="progress-row"><time id="elapsed">00:00</time><input id="scrubber" aria-label="演出进度" type="range" min="0" max="211" step="0.05" value="0"><time id="total">03:31</time></div><div class="controls"><div class="control-group"><button id="restart" class="icon-button" aria-label="从头播放" title="从头播放">↺</button><button id="prev" class="icon-button" aria-label="上一段" title="上一段">‹</button><button id="play" class="primary" disabled>准备中</button><button id="next" class="icon-button" aria-label="下一段" title="下一段">›</button></div><div class="control-group"><label class="speed-label">速度 <select id="speed" aria-label="播放速度"><option value="1">1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><button id="fullscreen" class="quiet" aria-label="全屏舞台">全屏</button></div></div></div>
   <details class="audio-settings"><summary>声音</summary><div class="audio-settings-body"><button id="audio-mute" aria-pressed="false">静音</button><label>配乐 <input id="music-volume" aria-label="配乐音量" type="range" min="0" max="1" step="0.05" value="0.45"></label><label>文字音效 <input id="voice-volume" aria-label="文字音效音量" type="range" min="0" max="1" step="0.05" value="0.55"></label><span id="audio-status" role="status">播放时启用声音</span><a href="./assets/music/CREDITS.md" target="_blank" rel="noopener">配乐来源</a></div></details>
  </div>
  <aside class="chapter-panel"><div class="chapter-heading"><p class="eyebrow">本场说书</p><span id="segment-count">十四段</span></div><ol id="chapters"></ol></aside>
 </section>
 <div id="generation-panel" class="generation-panel hidden"><div><strong>DeepSeek Flash</strong><span id="generation-status" role="status">准备生成第一场</span></div><button id="generate-story">生成第一场</button></div>
 <footer><span>红楼人物与环境卡 · 文字说书舞台</span><span id="source-status">助手预编示例</span></footer>
</main>
<dialog id="inspector"><div class="inspector-head"><div><p class="eyebrow">说书总控 · 数据查看</p><h2>一段话，也是一组动作</h2></div><button id="close-inspector" class="icon-button" aria-label="关闭演出指令">×</button></div><p class="inspector-note">这里展示正在播放的结构化指令，以及交给下一次生成的角色、环境和上下文。正文由 DeepSeek 生成；这里保留人物知情范围和对白对象的检查资料，不在演出画面显示。</p><div class="tabs"><button id="tab-beat" class="active">当前段落</button><button id="tab-context">总控上下文</button></div><pre id="instruction-json"></pre><div class="inspector-actions"><button id="download-script">下载本场 JSON</button><label class="upload">载入同格式演出<input id="import-script" type="file" accept="application/json,.json"></label></div><p id="import-status" role="status"></p></dialog>
<script type="module" src="./src/app.js?v=20261117-returnhome"></script>
</body></html>
